name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Repository variable CLOUD_API (Settings → Secrets and variables →
          # Actions → Variables). Unset = empty = cloud engine stays hidden and
          # the site builds exactly as it does today. Set it to the API's
          # public origin to light up cloud clipping, accounts, and billing.
          NEXT_PUBLIC_CLOUD_API: ${{ vars.CLOUD_API }}
          # Repository variable GOOGLE_CLIENT_ID — the same OAuth client id the
          # API verifies ID tokens against (CC_GOOGLE_CLIENT_ID). Unset = the
          # "Sign in with Google" button never renders and Google's script is
          # never loaded; email and password are unaffected either way.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
