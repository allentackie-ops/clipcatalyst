<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The mark bare, at full size: a favicon is 16px of real estate and a
       container square would spend a third of it on the container. Edges sit
       on whole pixels at 16px, so the three clips stay separate rather than
       blurring into one block. -->
  <defs>
    <linearGradient id="ccm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <g fill="url(#ccm)">
    <path d="M3.75 3 H7.5 V15 H3.75 A2.25 2.25 0 0 1 1.5 12.75 V5.25 A2.25 2.25 0 0 1 3.75 3 Z"/>
    <path d="M9 6 H15 V18 H9 Z"/>
    <path d="M16.5 9 H20.25 A2.25 2.25 0 0 1 22.5 11.25 V18.75 A2.25 2.25 0 0 1 20.25 21 H16.5 Z"/>
  </g>
</svg>
